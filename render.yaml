services:
  - type: web
    name: smartmall-ai-demo-api
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: 'off'
    buildCommand: pip install uv==0.13.8 && uv sync --frozen --no-dev
    startCommand: uv run --no-sync python -m app.deploy
    healthCheckPath: /health/ready
    envVars:
      - key: APP_ENV
        value: demo
      - key: AI_SIMULATION
        value: 'true'
      - key: DEMO_SEED
        value: 'true'
      - key: DEMO_ACCESS_TOKEN
        value: ''
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
