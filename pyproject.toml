[project]
name = "smartmall-ai-backend"
version = "0.1.0"
description = "API de ocorrências operacionais do SmartMall AI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.7",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "sqlalchemy==2.0.57",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = ["httpx2==2.16.0", "pytest==9.2.0", "ruff==0.17.5"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
