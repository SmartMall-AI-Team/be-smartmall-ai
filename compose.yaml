services:
  db:
    image: postgres:18.7
    environment:
      POSTGRES_DB: smartmall
      POSTGRES_USER: smartmall
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmall -d smartmall"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
